# Builds Tratto for each platform when a version tag (v1.2.3, or a
# pre-release such as v1.2.3-beta1) is pushed and attaches what
# scripts/package.sh makes to a draft release: the installers
# (Tratto-x64.msi, Tratto-arm64.dmg, Tratto-x86_64.AppImage) and the
# archives the updater installs (tratto-<target>.zip,
# tratto-<target>.app.zip). Once the draft is published, the app's updater
# (crates/ui/src/update.rs) offers it on a channel picked by the tag's
# suffix (none: stable, -rc<n> or -beta<n>: testing, -alpha<n>: unstable) and finds
# its file by name. A tag with a suffix is flagged as a pre-release here,
# so GitHub never shows it as the latest release.
#
# Run by hand (Actions > Release > Run workflow), it only builds: the files
# are in the run's artifacts (e.g. the macOS ones, which cannot be built on
# Windows or Linux).
#
# Signing, each part only once set up in the repository's settings
# (Settings > Secrets and variables > Actions); else the files are
# unsigned (macOS: ad hoc):
# * Windows, with Azure Artifact Signing: the variables
#   ARTIFACT_SIGNING_ENDPOINT (e.g. https://weu.codesigning.azure.net/),
#   ARTIFACT_SIGNING_ACCOUNT and ARTIFACT_SIGNING_PROFILE, and the secrets
#   AZURE_TENANT_ID, AZURE_CLIENT_ID and AZURE_CLIENT_SECRET of an app
#   registration with the "Artifact Signing Certificate Profile Signer"
#   role on the account.
# * macOS, with an Apple Developer ID: the secrets APPLE_CERTIFICATE (the
#   "Developer ID Application" certificate and key, a .p12 in base64),
#   APPLE_CERTIFICATE_PASSWORD and APPLE_SIGNING_IDENTITY ("Developer ID
#   Application: Name (TEAMID)"); for notarization also APPLE_ID,
#   APPLE_TEAM_ID and APPLE_APP_PASSWORD (an app-specific password).

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            target: x86_64-pc-windows-msvc
          # The oldest supported runner: the binary runs on older glibc too.
          - os: ubuntu-22.04
            platform: linux
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            platform: macos
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      WINDOWS_SIGNING: ${{ matrix.platform == 'windows' && vars.ARTIFACT_SIGNING_ACCOUNT != '' }}
      MACOS_SIGNING: ${{ matrix.platform == 'macos' && secrets.APPLE_SIGNING_IDENTITY != '' }}
    steps:
      - uses: actions/checkout@v4

      # A pre-release tag (v1.2.3-alpha0, v1.2.3-beta1) builds the version
      # 1.2.3 of Cargo.toml; the app is told the full one, for its updater.
      - name: Check the tag matches the version
        if: github.ref_type == 'tag'
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          tag_version=${GITHUB_REF_NAME#v}
          if [ "${tag_version%%-*}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version in Cargo.toml ($version)"
            exit 1
          fi
          echo "TRATTO_VERSION=$tag_version" >> "$GITHUB_ENV"

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      # Without PDFium (fetched by the packaging below) or a GPU, the tests
      # that need them are skipped.
      - name: Test
        run: cargo test --workspace --locked

      - name: Build
        run: bash scripts/package.sh --build-only ${{ matrix.platform }}

      - name: Sign the executable
        if: env.WINDOWS_SIGNING == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\target\${{ matrix.target }}\release\tratto.exe
          description: Tratto

      # A keychain of its own, for this run only, with the Developer ID.
      - name: macOS signing certificate
        if: env.MACOS_SIGNING == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain=$RUNNER_TEMP/signing.keychain-db
          password=$(openssl rand -hex 16)
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"

      - name: Package
        env:
          TRATTO_MACOS_IDENTITY: ${{ env.MACOS_SIGNING == 'true' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ env.MACOS_SIGNING == 'true' && secrets.APPLE_ID || '' }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash scripts/package.sh --bundle-only ${{ matrix.platform }}

      - name: Sign the installer
        if: env.WINDOWS_SIGNING == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\dist\Tratto-x64.msi
          description: Tratto

      - uses: actions/upload-artifact@v4
        with:
          name: tratto-${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft "${prerelease[@]}" --generate-notes --title "Tratto ${GITHUB_REF_NAME#v}"
