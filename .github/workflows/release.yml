# Builds InkNote for each platform when a version tag (v1.2.3) is pushed and
# attaches one archive per platform, `inknote-<target>.zip`, to a draft
# release. Publishing the draft makes it the latest release: the app's
# updater (crates/ui/src/update.rs) finds it by that name.
#
# Run by hand (Actions > Release > Run workflow), it only builds: the
# archives are in the run's artifacts (e.g. the macOS one, which cannot be
# built on Windows or Linux).
#
# The archives are made by scripts/package.sh, as on a local machine.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            target: x86_64-pc-windows-msvc
          # The oldest supported runner: the binary runs on older glibc too.
          - os: ubuntu-22.04
            platform: linux
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            platform: macos
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the version
        if: github.ref_type == 'tag'
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version in Cargo.toml ($version)"
            exit 1
          fi

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build and package
        run: bash scripts/package.sh ${{ matrix.platform }}

      - uses: actions/upload-artifact@v4
        with:
          name: inknote-${{ matrix.target }}
          path: dist/inknote-${{ matrix.target }}.zip

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --repo "$GITHUB_REPOSITORY" --draft --generate-notes --title "InkNote ${GITHUB_REF_NAME#v}"
