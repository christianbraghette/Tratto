# Checks that every author of a pull request's commits has signed the
# Contributor License Agreement (CLA.md), with CLA Assistant Lite.
#
# A contributor signs by commenting the sentence below on the pull
# request. The signature (GitHub user name and id, pull request, date) is
# committed to signatures/cla.json on the `cla-signatures` branch, so the
# record stays in this repository. That branch must exist and must not be
# protected: GITHUB_TOKEN pushes to it directly.
#
# Commenting `recheck` runs the check again (for example after the
# allowlist changed).
#
# pull_request_target runs with write access even for pull requests from
# forks. That is safe here because the workflow never checks out or runs
# the pull request's code.

name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the Tratto CLA and I hereby sign it'))
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/christianbraghette/Tratto/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          # The maintainer and bots do not sign.
          allowlist: christianbraghette,dependabot[bot],github-actions[bot]
          custom-pr-sign-comment: I have read the Tratto CLA and I hereby sign it
          custom-notsigned-prcomment: >-
            Thank you for your contribution! Before it can be merged, each
            author of its commits needs to sign the
            [Tratto Contributor License Agreement](https://github.com/christianbraghette/Tratto/blob/main/CLA.md).
            You keep the copyright in your work: the CLA lets the project
            ship it under both the AGPL and commercial licenses, and
            promises it stays free software. To sign, read it and post the
            comment below on this pull request. You only sign once.
          custom-allsigned-prcomment: All contributors have signed the CLA. Thank you!
          lock-pullrequest-aftermerge: false
