[package]
name = "tratto-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Tratto backend: document model, editing history, storage, library and PDF export (no UI dependencies)"

[dependencies]
emath.workspace = true
serde.workspace = true
bincode = "1.3"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# PDFium bindings, for notes written on a PDF. The library itself is loaded at
# runtime (see pdf_pages.rs); no image crate needed.
pdfium-render = { version = "0.9.4", default-features = false, features = ["pdfium_latest", "thread_safe"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
