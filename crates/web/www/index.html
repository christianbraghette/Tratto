<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tratto Reader</title>
  <link rel="icon" href="icon.png">
  <style>
    @font-face { font-family: Inter; src: url("fonts/Inter-Regular.ttf") format("truetype"); font-weight: 400; }
    @font-face { font-family: Inter; src: url("fonts/Inter-SemiBold.ttf") format("truetype"); font-weight: 600; }

    :root {
      --bg: #eceef1;
      --bar: #ffffff;
      --text: #1d2026;
      --muted: #646b78;
      --line: #d9dde3;
      --button: #f3f4f6;
      --button-hover: #e6e8ec;
      --accent: #2f6fde;
      --accent-text: #ffffff;
      --shadow: 0 1px 3px rgba(20, 24, 31, 0.18), 0 4px 16px rgba(20, 24, 31, 0.08);
      --notice: #fff5d6;
      --notice-text: #5c4a12;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #17191d;
        --bar: #212429;
        --text: #e7e9ec;
        --muted: #9aa1ad;
        --line: #33373e;
        --button: #2b2f35;
        --button-hover: #363a41;
        --accent: #5b8ef0;
        --accent-text: #0e1117;
        --shadow: 0 1px 3px rgba(0, 0, 0, 0.5), 0 4px 16px rgba(0, 0, 0, 0.3);
        --notice: #3a3220;
        --notice-text: #f0dfaa;
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #17191d;
      --bar: #212429;
      --text: #e7e9ec;
      --muted: #9aa1ad;
      --line: #33373e;
      --button: #2b2f35;
      --button-hover: #363a41;
      --accent: #5b8ef0;
      --accent-text: #0e1117;
      --shadow: 0 1px 3px rgba(0, 0, 0, 0.5), 0 4px 16px rgba(0, 0, 0, 0.3);
      --notice: #3a3220;
      --notice-text: #f0dfaa;
      color-scheme: dark;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 14px/1.4 Inter, system-ui, sans-serif;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: var(--bar);
      border-bottom: 1px solid var(--line);
      flex-wrap: wrap;
    }
    header h1 {
      flex: 1 1 160px;
      min-width: 0;
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .group { display: flex; align-items: center; gap: 4px; }
    button, .button {
      font: inherit;
      color: var(--text);
      background: var(--button);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 5px 10px;
      cursor: pointer;
      white-space: nowrap;
    }
    button:hover, .button:hover { background: var(--button-hover); }
    button:disabled { opacity: 0.45; cursor: default; }
    button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
    #pages-label, #zoom-label { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 56px; text-align: center; }
    input[type="file"] { display: none; }

    #notice {
      display: none;
      padding: 8px 16px;
      background: var(--notice);
      color: var(--notice-text);
      border-bottom: 1px solid var(--line);
    }
    #notice.shown { display: block; }

    main { flex: 1; overflow: auto; position: relative; }
    #pages {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 16px;
      width: max-content;
      min-width: 100%;
    }
    .page { position: relative; background: #ffffff; box-shadow: var(--shadow); }
    .page canvas { display: block; width: 100%; height: 100%; }

    #empty {
      position: absolute;
      inset: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      border: 2px dashed var(--line);
      border-radius: 12px;
      color: var(--muted);
      text-align: center;
      padding: 16px;
    }
    #empty[hidden] { display: none; }
    #empty strong { color: var(--text); font-size: 17px; font-weight: 600; }
    body.dragging #empty, body.dragging main { outline: 2px solid var(--accent); outline-offset: -4px; }
  </style>
  <script type="module" src="main.js"></script>
</head>
<body>
  <header>
    <label class="button" for="file">Open…</label>
    <input id="file" type="file" accept=".ink,.pdf,application/pdf">
    <h1 id="title">Tratto Reader</h1>
    <div class="group">
      <button id="zoom-out" title="Zoom out (−)" disabled>−</button>
      <span id="zoom-label">–</span>
      <button id="zoom-in" title="Zoom in (+)" disabled>+</button>
      <button id="fit" title="Fit the page width (0)" disabled>Fit</button>
    </div>
    <span id="pages-label"></span>
    <button id="export" class="primary" title="Save the note as a PDF, as the app exports it" disabled>Export PDF</button>
  </header>
  <div id="notice" role="status"></div>
  <main id="view">
    <div id="empty">
      <strong>Open a Tratto note or a PDF</strong>
      <span>Drop a <code>.ink</code> or <code>.pdf</code> file here, or use Open…</span>
      <span>Files are read in your browser and never uploaded.</span>
    </div>
    <div id="pages"></div>
  </main>
</body>
</html>
