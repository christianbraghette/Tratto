[workspace]
resolver = "3"
members = ["crates/core", "crates/ui"]
# `cargo run` / `cargo build` at the root target the application.
default-members = ["crates/ui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["Christian Braghette <info@tratto.page>"]
# Also available under a commercial license, see README.md.
license = "AGPL-3.0-or-later"
repository = "https://github.com/christianbraghette/Tratto"

[workspace.dependencies]
tratto-core = { path = "crates/core" }
# `emath` is the math crate egui is built on; sharing it keeps core types
# (Pos2, Rect) directly usable by the UI without pulling egui into core.
emath = "0.36.2"
eframe = { version = "0.36.2", features = ["wgpu", "persistence"] }
# `rc`: stroke points are shared (`Arc<[Point]>`), encoded like a `Vec`.
serde = { version = "1", features = ["derive", "rc"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
