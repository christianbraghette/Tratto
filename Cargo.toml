[package]
name = "inknote"
version = "0.1.0"
edition = "2021"
rust-version = "1.76"
description = "Minimal cross-platform digital handwriting note-taking app (egui + wgpu)"

[dependencies]
# Default features already include the Wayland + X11 backends and default fonts.
# `wgpu` adds the wgpu renderer, `persistence` lets us store UI settings between runs.
eframe = { version = "0.29", features = ["wgpu", "persistence"] }
serde = { version = "1", features = ["derive"] }
bincode = "1.3"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
